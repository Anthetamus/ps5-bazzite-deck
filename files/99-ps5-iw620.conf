# PS5 IW620 Wi-Fi: NetworkManager's randomized scan MAC changes the adapter
# address mid-scan and invalidates KDE's access-point list, which makes GUI
# Wi-Fi joins fail. Keep the permanent MAC and moderate power saving.
# (Tested settings from gzimbric/ps5-linux-porting.)
[device]
wifi.scan-rand-mac-address=no

[connection]
wifi.cloned-mac-address=permanent
wifi.powersave=2
